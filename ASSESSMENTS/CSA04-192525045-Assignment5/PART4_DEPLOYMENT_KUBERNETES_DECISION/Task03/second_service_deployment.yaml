# Second service: notice-service. Separate Deployment, separate labels, its own requests and limits.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notice-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notice-service
  template:
    metadata:
      labels:
        app: notice-service
    spec:
      containers:
      - name: notice
        image: simats/notice-service:1.0
        ports:
        - containerPort: 8100
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8100
