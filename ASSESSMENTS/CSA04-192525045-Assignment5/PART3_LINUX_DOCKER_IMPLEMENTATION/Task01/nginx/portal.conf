# /etc/nginx/sites-available/portal  (symlinked into sites-enabled)
upstream portal_app {
    server 127.0.0.1:8000;
}

server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/portal_access.log;
    error_log  /var/log/nginx/portal_error.log;

    location / {
        proxy_pass http://portal_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# HTTPS (port 443) needs a certificate for the real domain. The 443 firewall rule is part of
# the rule set, but no TLS server block is enabled in this sandbox test (see B1_Implementation_Report.md).
